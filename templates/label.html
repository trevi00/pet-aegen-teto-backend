<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>데이터셋 라벨링</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9ff;
            border-radius: 15px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            margin-top: 5px;
        }

        .upload-section {
            margin-bottom: 30px;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-area:hover {
            background: #f8f9ff;
        }

        #file-input {
            display: none;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .preview-item {
            position: relative;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 10px;
            background: white;
        }

        .preview-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .label-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-aegen {
            background: linear-gradient(135deg, #FF6B35 0%, #FFA600 100%);
            color: white;
        }

        .btn-teto {
            background: linear-gradient(135deg, #FFB3C1 0%, #FFE5EC 100%);
            color: #333;
        }

        .btn-remove {
            background: #999;
            color: white;
            width: 100%;
            margin-top: 5px;
        }

        .labeled {
            border-color: #4CAF50;
            background: #f1f8f4;
        }

        .label-tag {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #4CAF50;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
        }

        .action-buttons {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .big-btn {
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .big-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .btn-train {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-clear {
            background: #999;
            color: white;
        }

        .btn-back {
            background: #333;
            color: white;
        }

        .message {
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏷️ 데이터셋 라벨링</h1>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-number" id="total-count">0</div>
                <div class="stat-label">전체 이미지</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="aegen-count">0</div>
                <div class="stat-label">에겐 💪</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="teto-count">0</div>
                <div class="stat-label">테토 🥰</div>
            </div>
            <div class="stat-item">
                <div class="stat-number" id="unlabeled-count">0</div>
                <div class="stat-label">미분류</div>
            </div>
        </div>

        <div class="message" id="message"></div>

        <div class="upload-section">
            <div class="upload-area" id="upload-area">
                <div style="font-size: 3em;">📸</div>
                <div style="margin: 15px 0; font-size: 1.2em; color: #333;">
                    이미지를 드래그하거나 클릭하여 업로드
                </div>
                <div style="color: #999;">
                    여러 장 동시 업로드 가능 (JPG, PNG)
                </div>
                <input type="file" id="file-input" accept="image/*" multiple>
            </div>
        </div>

        <div class="preview-grid" id="preview-grid"></div>

        <div class="action-buttons">
            <button class="big-btn btn-back" onclick="location.href='/'">← 메인으로</button>
            <button class="big-btn btn-train" id="train-btn">🚀 학습 시작</button>
            <button class="big-btn btn-clear" id="clear-btn">🗑️ 전체 삭제</button>
        </div>
    </div>

    <script>
        let images = [];
        let imageCounter = 0;

        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        const previewGrid = document.getElementById('preview-grid');
        const messageEl = document.getElementById('message');

        // 업로드 영역 클릭
        uploadArea.addEventListener('click', () => fileInput.click());

        // 파일 선택
        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
            fileInput.value = '';
        });

        // 드래그 앤 드롭
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.background = '#e8ecff';
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.background = '';
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.background = '';
            handleFiles(e.dataTransfer.files);
        });

        function handleFiles(files) {
            for (let file of files) {
                if (!file.type.startsWith('image/')) continue;

                const id = imageCounter++;
                const reader = new FileReader();

                reader.onload = (e) => {
                    images.push({
                        id: id,
                        file: file,
                        dataUrl: e.target.result,
                        label: null
                    });
                    renderImages();
                };

                reader.readAsDataURL(file);
            }
        }

        function renderImages() {
            previewGrid.innerHTML = '';

            images.forEach((img) => {
                const item = document.createElement('div');
                item.className = 'preview-item' + (img.label ? ' labeled' : '');

                item.innerHTML = `
                    ${img.label ? `<div class="label-tag">${img.label === 'aegen' ? '에겐 💪' : '테토 🥰'}</div>` : ''}
                    <img src="${img.dataUrl}" class="preview-image" alt="preview">
                    <div class="label-buttons">
                        <button class="btn btn-aegen" onclick="labelImage(${img.id}, 'aegen')">에겐</button>
                        <button class="btn btn-teto" onclick="labelImage(${img.id}, 'teto')">테토</button>
                    </div>
                    <button class="btn btn-remove" onclick="removeImage(${img.id})">삭제</button>
                `;

                previewGrid.appendChild(item);
            });

            updateStats();
        }

        function labelImage(id, label) {
            const img = images.find(i => i.id === id);
            if (img) {
                img.label = label;
                renderImages();
            }
        }

        function removeImage(id) {
            images = images.filter(i => i.id !== id);
            renderImages();
        }

        function updateStats() {
            const total = images.length;
            const aegen = images.filter(i => i.label === 'aegen').length;
            const teto = images.filter(i => i.label === 'teto').length;
            const unlabeled = total - aegen - teto;

            document.getElementById('total-count').textContent = total;
            document.getElementById('aegen-count').textContent = aegen;
            document.getElementById('teto-count').textContent = teto;
            document.getElementById('unlabeled-count').textContent = unlabeled;
        }

        function showMessage(text, type) {
            messageEl.textContent = text;
            messageEl.className = 'message ' + type;
            messageEl.style.display = 'block';
            setTimeout(() => {
                messageEl.style.display = 'none';
            }, 5000);
        }

        // 학습 시작
        document.getElementById('train-btn').addEventListener('click', async () => {
            const labeledImages = images.filter(i => i.label !== null);

            if (labeledImages.length < 10) {
                showMessage('최소 10장 이상의 이미지에 라벨을 붙여주세요!', 'error');
                return;
            }

            const aeigenCount = images.filter(i => i.label === 'aegen').length;
            const tetoCount = images.filter(i => i.label === 'teto').length;

            if (aeigenCount < 5 || tetoCount < 5) {
                showMessage('에겐과 테토 각각 최소 5장 이상 필요합니다!', 'error');
                return;
            }

            if (confirm(`총 ${labeledImages.length}장의 이미지로 학습을 시작하시겠습니까?\n(에겐: ${aeigenCount}장, 테토: ${tetoCount}장)`)) {
                showMessage('데이터셋 업로드 중...', 'info');

                const formData = new FormData();
                labeledImages.forEach((img, index) => {
                    formData.append('images', img.file);
                    formData.append('labels', img.label);
                });

                try {
                    const response = await fetch('/upload_dataset', {
                        method: 'POST',
                        body: formData
                    });

                    const data = await response.json();

                    if (data.success) {
                        showMessage('데이터셋 저장 완료! 이제 학습을 시작하세요.', 'success');
                        setTimeout(() => {
                            location.href = '/train';
                        }, 2000);
                    } else {
                        showMessage('오류: ' + data.error, 'error');
                    }
                } catch (error) {
                    showMessage('서버 연결 오류가 발생했습니다.', 'error');
                }
            }
        });

        // 전체 삭제
        document.getElementById('clear-btn').addEventListener('click', () => {
            if (confirm('모든 이미지를 삭제하시겠습니까?')) {
                images = [];
                renderImages();
                showMessage('모든 이미지가 삭제되었습니다.', 'info');
            }
        });
    </script>
</body>
</html>
