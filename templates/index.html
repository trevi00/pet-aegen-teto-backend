<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>반려동물 에겐 vs 테토 테스트</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            background: #f8f9ff;
            border-color: #764ba2;
        }

        .upload-area.dragover {
            background: #e8ecff;
            border-color: #667eea;
        }

        .upload-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .upload-text {
            color: #666;
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        #file-input {
            display: none;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.1em;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .preview-container {
            margin: 30px 0;
            text-align: center;
            display: none;
        }

        .preview-image {
            max-width: 100%;
            max-height: 400px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .result-container {
            display: none;
            margin-top: 30px;
        }

        .result-image {
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }

        .share-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 30px 0;
        }

        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 20px;
            color: #666;
            font-size: 1.1em;
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            display: none;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2em;
            }

            .container {
                padding: 20px;
            }

            .upload-area {
                padding: 40px 20px;
            }

            .share-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐾 반려동물 에겐 vs 테토 테스트</h1>
        <p class="subtitle">당신의 반려동물은 에겐일까요, 테토일까요?</p>

        <div style="text-align: center; margin: -10px 0 20px 0;">
            <a href="/auto_collect_page" style="color: #667eea; text-decoration: none; font-size: 0.9em; border-bottom: 1px dashed #667eea; margin-right: 15px;">
                🤖 자동 이미지 수집하기
            </a>
            <a href="/label" style="color: #667eea; text-decoration: none; font-size: 0.9em; border-bottom: 1px dashed #667eea;">
                🏷️ 수동 라벨링하기
            </a>
        </div>

        <div class="error-message" id="error-message"></div>

        <div class="upload-area" id="upload-area">
            <div class="upload-icon">📸</div>
            <div class="upload-text">이미지를 클릭하거나 드래그하여 업로드하세요</div>
            <div style="color: #999; font-size: 0.9em; margin-top: 10px;">JPG, PNG 파일 지원</div>
            <input type="file" id="file-input" accept="image/*">
        </div>

        <div class="preview-container" id="preview-container">
            <img id="preview-image" class="preview-image" alt="미리보기">
            <div style="margin-top: 20px;">
                <button class="btn" id="analyze-btn">🔍 분석 시작하기</button>
                <button class="btn" id="cancel-btn" style="background: #999;">취소</button>
            </div>
        </div>

        <div class="loading" id="loading">
            <div class="loading-spinner"></div>
            <div class="loading-text">AI가 열심히 분석 중입니다... 🤖</div>
        </div>

        <div class="result-container" id="result-container">
            <img id="result-image" class="result-image" alt="결과">
            <div class="share-buttons">
                <button class="btn" id="download-btn">💾 이미지 다운로드</button>
                <button class="btn" id="instagram-btn">📱 인스타그램 공유</button>
                <button class="btn" id="retry-btn" style="background: #999;">🔄 다시 테스트</button>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        const previewContainer = document.getElementById('preview-container');
        const previewImage = document.getElementById('preview-image');
        const analyzeBtn = document.getElementById('analyze-btn');
        const cancelBtn = document.getElementById('cancel-btn');
        const loading = document.getElementById('loading');
        const resultContainer = document.getElementById('result-container');
        const resultImage = document.getElementById('result-image');
        const downloadBtn = document.getElementById('download-btn');
        const instagramBtn = document.getElementById('instagram-btn');
        const retryBtn = document.getElementById('retry-btn');
        const errorMessage = document.getElementById('error-message');

        let selectedFile = null;

        // 업로드 영역 클릭
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // 파일 선택
        fileInput.addEventListener('change', (e) => {
            handleFile(e.target.files[0]);
        });

        // 드래그 앤 드롭
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFile(e.dataTransfer.files[0]);
        });

        function handleFile(file) {
            if (!file || !file.type.startsWith('image/')) {
                showError('이미지 파일만 업로드 가능합니다.');
                return;
            }

            selectedFile = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImage.src = e.target.result;
                uploadArea.style.display = 'none';
                previewContainer.style.display = 'block';
                errorMessage.style.display = 'none';
            };
            reader.readAsDataURL(file);
        }

        // 취소 버튼
        cancelBtn.addEventListener('click', () => {
            reset();
        });

        // 분석 버튼
        analyzeBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            const formData = new FormData();
            formData.append('image', selectedFile);

            previewContainer.style.display = 'none';
            loading.style.display = 'block';

            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    resultImage.src = '/result/' + data.result_image + '?t=' + new Date().getTime();
                    loading.style.display = 'none';
                    resultContainer.style.display = 'block';

                    // 다운로드 버튼 설정
                    downloadBtn.onclick = () => downloadImage(data.result_image);
                    instagramBtn.onclick = () => shareToInstagram(data.result_image);
                } else {
                    showError(data.error || '분석 중 오류가 발생했습니다.');
                    loading.style.display = 'none';
                    previewContainer.style.display = 'block';
                }
            } catch (error) {
                showError('서버 연결 오류가 발생했습니다.');
                loading.style.display = 'none';
                previewContainer.style.display = 'block';
            }
        });

        // 다시 테스트
        retryBtn.addEventListener('click', () => {
            reset();
        });

        function reset() {
            selectedFile = null;
            fileInput.value = '';
            uploadArea.style.display = 'block';
            previewContainer.style.display = 'none';
            resultContainer.style.display = 'none';
            errorMessage.style.display = 'none';
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        function downloadImage(filename) {
            const link = document.createElement('a');
            link.href = '/result/' + filename;
            link.download = 'pet-test-result.jpg';
            link.click();
        }

        function shareToInstagram(filename) {
            // 모바일에서는 인스타그램 앱으로 공유
            if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                // 모바일: 이미지 다운로드 안내
                alert('이미지를 다운로드한 후 인스타그램 앱에서 직접 업로드해주세요!');
                downloadImage(filename);
            } else {
                // PC: 이미지 다운로드
                alert('이미지를 다운로드하여 인스타그램에 업로드해주세요!');
                downloadImage(filename);
            }
        }
    </script>
</body>
</html>
