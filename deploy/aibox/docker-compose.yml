# agtt.cloud 배포 (aibox). 외부 노출은 cloudflared 터널 하나뿐 — 호스트 포트는 127.0.0.1 에만.
name: agtt

services:
  backend:
    build:
      context: ./pet-aegen-teto-backend
      dockerfile: Dockerfile.prod
    environment:
      GUNICORN_WORKERS: "1"
      MODEL_TEMPERATURE: "3.078"   # models/calibration.json (2026-09-27, 정답 240장으로 보정)
      ALLOWED_ORIGINS: "https://agtt.cloud,https://www.agtt.cloud"
    read_only: true
    tmpfs:
      - /app/uploads:size=64m,uid=10001
      - /app/results:size=16m,uid=10001
      - /tmp:size=64m
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 6g
    cpus: 6
    pids_limit: 256
    networks: [internal]
    restart: unless-stopped

  web:
    build:
      context: ./pet-aegen-teto-web
      args:
        VITE_API_URL: /api
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=1m
      - /tmp:size=16m
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 256m
    cpus: 1
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal, edge]
    restart: unless-stopped

  tunnel:
    # digest 고정 (월 1회 갱신 + Trivy 스캔). 이미지 자체가 uid 65532 non-root
    image: cloudflare/cloudflared@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    # 토큰은 환경변수가 아니라 비밀 파일로 (docker inspect 에 안 보이게), 메트릭은 컨테이너 내부 전용
    command: tunnel --no-autoupdate --metrics 127.0.0.1:20241 run --token-file /run/secrets/tunnel_token
    secrets: [tunnel_token]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 256m
    cpus: 0.5
    depends_on: [web]
    networks: [edge]   # web:8080 만 본다 — backend(internal) 와는 분리
    restart: unless-stopped

secrets:
  tunnel_token:
    file: ./secrets/tunnel_token   # 호스트 디렉토리 700, git 밖

networks:
  internal:
    internal: true   # backend 는 인터넷·호스트 LAN 에 나가지 못한다
  edge:
    ipam:
      config:
        - subnet: 172.31.250.0/29   # nginx set_real_ip_from / allow 와 일치해야 함
